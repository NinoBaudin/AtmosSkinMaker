<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <title>Atmos RP - Skin Builder 3D HD</title>
  
  <!-- Mise à jour de la bibliothèque vers la version bundle universelle -->
  <script src="https://cdn.jsdelivr.net/npm/skinview3d@3/dist/skinview3d.bundle.js"></script>

  <style>
    body { font-family: sans-serif; background: #1e1e1e; color: #fff; text-align: center; }
    
    #skinCanvas { display: none; }
    
    #skin_container { border: 2px solid #555; background: #2a2a2a; border-radius: 8px; cursor: grab; }
    #skin_container:active { cursor: grabbing; }

    .controls { margin: 15px 0; }
    select, button, input[type="color"] { padding: 10px; margin: 5px; font-size: 16px; vertical-align: middle; }
    input[type="color"] { height: 42px; width: 60px; border: none; cursor: pointer; background: none; }
    .layout { display: flex; flex-wrap: wrap; justify-content: center; align-items: center; gap: 30px; margin-top: 20px; }
  </style>
</head>
<body>

  <h1>Créateur de Skin 3D HD - Atmos RP</h1>

  <div class="layout">
    <div>
      <div class="controls">
        <label>Corps :</label>
        <select id="base" onchange="updateSkin()">
          <option value="assets/Corps/caro.png">Steve</option>
          <option value="assets/Corps/caro02.png">Steve 2</option>
        </select>
      </div>

      <div class="controls">
        <label>Cheveux :</label>
        <select id="hair" onchange="updateSkin()">
          <option value="">Aucun</option>
          <option value="assets/Cheveux/cheveux1.png">Cheveux 01</option>
          <option value="assets/Cheveux/cheveux2.png">Cheveux 02</option>
          <option value="assets/Cheveux/cheveux3.png">Cheveux 03</option>
          <option value="assets/Cheveux/cheveux4.png">Cheveux 04</option>
        </select>
        
        <label for="hairColor">Couleur :</label>
        <input type="color" id="hairColor" value="#8b5a2b" oninput="updateSkin()">
      </div>

      <div class="controls">
        <label>Tenue :</label>
        <select id="outfit" onchange="updateSkin()">
          <option value="">Aucune</option>
          <option value="assets/Tenue/fourrure.png">Fourrure</option>
          <option value="assets/Tenue/AugusteManteauDelave.png">Auguste Manteau Delave</option>
        </select>
      </div>

      <div class="controls">
        <label>Yeux :</label>
        <select id="eyes" onchange="updateSkin()">
          <option value="">Aucune</option>
          <option value="assets/Yeux/YeuxBleu.png">Yeux Bleu</option>
          <option value="assets/Yeux/YeuxBrun.png">Yeux Brun</option>
          <option value="assets/Yeux/YeuxVert.png">Yeux Vert</option>
        </select>
      </div>

      <br>
      <button onclick="downloadSkin()">Télécharger mon Skin HD (.png)</button>
    </div>

    <div>
      <canvas id="skin_container"></canvas>
    </div>
  </div>

  <!-- Canvas unique en 256x256 -->
  <canvas id="skinCanvas" width="256" height="256"></canvas>

  <script>
    const canvas = document.getElementById('skinCanvas');
    const ctx = canvas.getContext('2d');

    const offscreenCanvas = document.createElement('canvas');
    offscreenCanvas.width = 256;
    offscreenCanvas.height = 256;
    const offscreenCtx = offscreenCanvas.getContext('2d');

    // Initialisation avec forçage du rendu des textures HD
    let skinViewer = new skinview3d.SkinViewer({
      canvas: document.getElementById("skin_container"),
      width: 300,
      height: 400
    });

    // Optionnel : ajuste le type de modèle si vos skins HD utilisent des bras de 4px (default) ou 3px (alex)
    skinViewer.playerObject.skin.modelType = "default";

    let control = skinview3d.createOrbitControls(skinViewer);
    control.enableRotate = true;
    control.enableZoom = true;
    control.enablePan = false;

    function loadImage(src) {
      return new Promise((resolve) => {
        if (!src) return resolve(null);
        const img = new Image();
        img.crossOrigin = "Anonymous";
        img.onload = () => resolve(img);
        img.onerror = () => resolve(null);
        img.src = src;
      });
    }

    function colorizeImage(img, hexColor) {
      if (!img) return null;
      offscreenCtx.clearRect(0, 0, 256, 256);
      offscreenCtx.drawImage(img, 0, 0);
      offscreenCtx.globalCompositeOperation = 'multiply';
      offscreenCtx.fillStyle = hexColor;
      offscreenCtx.fillRect(0, 0, 256, 256);
      offscreenCtx.globalCompositeOperation = 'destination-in';
      offscreenCtx.drawImage(img, 0, 0);
      offscreenCtx.globalCompositeOperation = 'source-over';
      return offscreenCanvas;
    }

    async function updateSkin() {
      ctx.clearRect(0, 0, 256, 256);

      const baseSrc = document.getElementById('base').value;
      const eyesSrc = document.getElementById('eyes').value;
      const hairSrc = document.getElementById('hair').value;
      const outfitSrc = document.getElementById('outfit').value;
      const hairColor = document.getElementById('hairColor').value;

      const [baseImg, eyesImg, hairImg, outfitImg] = await Promise.all([
        loadImage(baseSrc),
        loadImage(eyesSrc),
        loadImage(hairSrc),
        loadImage(outfitSrc)
      ]);

      if (baseImg) ctx.drawImage(baseImg, 0, 0);
      if (eyesImg) ctx.drawImage(eyesImg, 0, 0);

      if (hairImg) {
        const coloredHair = colorizeImage(hairImg, hairColor);
        ctx.drawImage(coloredHair, 0, 0);
      }

      if (outfitImg) ctx.drawImage(outfitImg, 0, 0);

      // Chargement direct du Canvas 256x256 dans le viewer 3D
      const dataUrl = canvas.toDataURL('image/png');
      skinViewer.loadSkin(dataUrl);
    }

    function downloadSkin() {
      const link = document.createElement('a');
      link.download = 'mon_skin_atmos_hd.png';
      link.href = canvas.toDataURL('image/png');
      link.click();
    }

    updateSkin();
  </script>
</body>
</html>
